<html lang="en">

<title>QR ID</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/id.css">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;

    background: #f4f6fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", Arial, sans-serif;
